services:
  app:
    build: .
    env_file: .env
    volumes: ["./data:/app/data", "./uploads:/app/uploads", "./backups:/app/backups"]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    restart: unless-stopped

